<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <div>
                <p>Фильтр grayscale</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: grayscale();">
            </div>
            <div>
                <p>Фильтр saturate</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: saturate(20%);">
            </div>
            <div>
                <p>Фильтр invert</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: invert();">
            </div>
        </div>
        <div class="box">
            <div>
                <p>Фильтр sepia</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: sepia();">
            </div>
            <div>
                <p>Фильтр hue-rotate</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: hue-rotate(100deg);">
            </div>
            <div>
                <p>Фильтр contrast</p>
                <img src="barbara.jpg" width="256" height="256">
                <img src="barbara.jpg" width="256" height="256" style="filter: contrast(40%);">
            </div>
        </div>
    </div>
</body>
</html>
